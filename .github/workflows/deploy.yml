name: Application CI

on:
  push:
    branches:
      - master

jobs:
    Shivam:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repo
          uses: actions/checkout@v6
        
        - name: Setup go
          uses: actions/setup-go@v6
          with: 
            go-version: '1.24'
            
        - name: Run go file
          run: go run main.go

