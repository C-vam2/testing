name: Application CI

on:
  push:
    branches:
      - master

jobs:
    Shivam:
      runs-on: ubuntu-latest

      steps:
        - 
          name: Checkout repo
          uses: actions/checkout@v6

        -
          name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        -
          name: Build and push
          uses: docker/build-push-action@v7
          with:
            push: true
            tags: cvam:latest
        
        

